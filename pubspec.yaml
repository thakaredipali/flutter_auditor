name: flutter_auditor
description: A CLI that audits Flutter projects for security misconfigurations (Android manifest, iOS Info.plist, hardcoded secrets, insecure network/storage) and dependency hygiene issues.
version: 1.0.0
repository: https://github.com/thakaredipali/flutter_auditor
issue_tracker: https://github.com/thakaredipali/flutter_auditor/issues

environment:
  sdk: ^3.9.2

executables:
  flutter_auditor:

# Add regular dependencies here.
dependencies:
  path: ^1.9.0
  args: ^2.7.0
  xml: ^6.6.0
  yaml: ^3.1.3
  pub_semver: ^2.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
